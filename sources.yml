# ============================================================================
# sources.yml — the ONLY file that differs between deploys.
#
# This is where you define which job boards to scan. The Python code reads this
# file and builds adapters from it, so the code itself is byte-identical across
# every deployment (e.g. one repo per person). To retarget the scanner for a
# different field, you edit THIS file and criteria.md — never the code.
#
# Two adapter types:
#   - rss:    any board with an RSS/Atom feed. Just give it a feed_url.
#   - indeed: scraped via JobSpy (no feed). Give it search terms + location.
#
# `expect_nonzero: true` adds the source to the health check: if it returns
# zero jobs on a run, the run fails loudly (email alert) so you know a feed
# URL changed or a scraper broke. Set it false for narrow feeds that can
# legitimately be empty (e.g. a niche board that posts a few times a month).
# ============================================================================

rss:
  # --- Theoretical CS: the highest-value source for this candidate ----------
  # CATCS-maintained board — faculty, postdocs, and research-lab positions in
  # theoretical computer science. Tightly scoped, so almost every posting is
  # relevant. WordPress feed. This is a low-volume, high-signal board, so it
  # can genuinely be empty for stretches — hence expect_nonzero: false.
  - name: cstheory
    feed_url: "https://cstheory-jobs.org/feed/"
    expect_nonzero: false

  # --- Chronicle of Higher Education (Madgex RSS) ---------------------------
  # Broad higher-ed board. Kept because faculty/research posts do appear here.
  # You can narrow server-side by adding &Keywords=computer+science to the URL,
  # but broad + AI filter is usually better.
  - name: chronicle
    feed_url: "https://jobs.chronicle.com/jobsrss/?countrycode=US"
    expect_nonzero: true

  # --- HigherEdJobs ---------------------------------------------------------
  # catID=102 is the Computer Science faculty category (verified). Shows CS
  # faculty and postdoc listings. (Earlier guesses: 68 = broad Higher Ed /
  # mostly admin; 101 = chemistry — both wrong for this candidate.)
  - name: higheredjobs_cs
    feed_url: "https://www.higheredjobs.com/rss/categoryFeed.cfm?catID=102"
    expect_nonzero: false

  # (Removed: academicpositions_toc — the guessed feed URL returned HTML, not
  #  a valid feed. If you want that board, find its real RSS URL first. The
  #  cstheory-jobs source above already covers theory roles well.)

  # --- AcademicKeys: Sciences (incl. Computer/Information Sciences) ----------
  # AcademicKeys publishes per-discipline RSS at <subdomain>.academickeys.com/rss.
  # Verify on first run: if it errors, try engineering.academickeys.com/rss
  # instead, or drop it. Low-volume academic board, so empty is fine.
  - name: academickeys_sciences
    feed_url: "https://sciences.academickeys.com/rss"
    expect_nonzero: false

indeed:
  # One scrape per search term. Keep the list short — each is a separate
  # request and Indeed rate-limits. Location "Remote" plus specific theory
  # terms keeps noise down; the AI filter handles the rest.
  - name: indeed
    search_terms:
      - "postdoc theoretical computer science"
      - "complexity theory researcher"
      - "research scientist algorithms theory"
    location: "Remote"
    country: "usa"
    results_wanted: 25
    hours_old: 48
    is_remote: null          # true / false / null
    # Narrow academic search terms legitimately return zero on many days, and
    # Indeed is a weak source for academic theory roles anyway (cstheory-jobs
    # does the heavy lifting). So an empty result here is NOT a problem.
    expect_nonzero: false
